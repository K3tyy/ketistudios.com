<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keti Studios</title>
<link rel="icon" href="erasmusgo/icon.png">
<style>
:root { --bg: #f4f8ff; --card: #ffffff; --text: #1b2433; --muted: #5b6678; --primary: #1f6fd6; --line: #dfe6f1; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1520; --card: #172031; --text: #e8edf5; --muted: #9aa6b8; --primary: #7cb6ff; --line: #26324a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 40px 16px 56px; }
h1 { font-size: 30px; margin: 0 0 6px; }
.muted { color: var(--muted); margin: 0 0 24px; }
a.app { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; color: var(--text); text-decoration: none; }
a.app img { width: 64px; height: 64px; border-radius: 14px; }
a.app strong { font-size: 19px; display: block; }
a { color: var(--primary); }
footer { margin-top: 28px; font-size: 15px; }
</style>
</head>
<body>
<main>
<h1>Keti Studios</h1>
<p class="muted">Small apps, made with care by Kevin Kralj.</p>
<a class="app" href="erasmusgo/"><img src="erasmusgo/icon.png" alt=""><span><strong>ErasmusGo</strong>Erasmus+ youth exchanges, training courses and volunteering in one app.</span></a>
<footer>Contact: <a href="mailto:info@ketistudios.com">info@ketistudios.com</a></footer>
</main>
</body>
</html>
